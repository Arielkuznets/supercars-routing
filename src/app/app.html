@if (isNavigating()) {
  <div class="nav-progress" aria-hidden="true"></div>
}

<header class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="logo">SUPER<span>CARS</span></a>

    <nav class="nav-links">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        <span class="icon">🏠</span> בית
      </a>

      <a routerLink="/garage" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="icon">🏎️</span> הגראז'
      </a>

      <a routerLink="/test-drive" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="icon">🗝️</span> נסיעת מבחן
      </a>
    </nav>
  </div>
</header>

<main class="main-content">
  <router-outlet />
</main>

<footer class="footer">נבנה ב-Angular 21 · Standalone Components · Signals · Lazy Routes</footer>
